[project]
name = "taskharbor"
version = "3.0.0"
description = "TaskHarbor: asynchronous multi-agent task orchestration with controlled execution and persistent artifacts."
readme = "README.md"
authors = [
    { name = "Eduardo Ramon Resser", email = "eduresser@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "deepagents==0.7.38",
    "langgraph>=1.2.20,<1.3",
    "langgraph-checkpoint-postgres>=3.0.4",
    "langchain>=1.5.0,<1.6",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.3.0",
    "docker>=7.0.0",
    "cryptography>=43.0.0",
    "pydantic-settings>=2.0.2",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "aegra-cli>=0.6.0",
]

[project.optional-dependencies]
frontend = [
    "streamlit>=1.41.0",
    "keyring>=25.0.0",
]

[project.scripts]
taskharbor = "taskharbor.cli:main"
taskharbor-frontend = "taskharbor.cli:run_frontend_entry"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "taskharbor"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
